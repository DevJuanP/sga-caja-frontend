<mat-form-field appearance="outline" class="cc-field">
  @if (label(); as label) {
    <mat-label>{{ label }}</mat-label>
  }
  <mat-select [formControl]="control()" [placeholder]="placeholder()">
    @if (allowEmpty()) {
      <mat-option [value]="null">Sin asignar</mat-option>
    }
    @for (item of items(); track item.uuid) {
      <mat-option [value]="item.uuid">{{ item.name }}</mat-option>
    }
  </mat-select>
</mat-form-field>
