<div class="cxc-selection-container">
  <table mat-table [dataSource]="data()" class="cxc-table">
    @if (selectable()) {
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef class="checkbox-cell">
          <mat-checkbox
            (change)="toggleAllRows()"
            [checked]="selection.hasValue() && isAllSelected()"
            [indeterminate]="selection.hasValue() && !isAllSelected()"
          ></mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row" class="checkbox-cell">
          <mat-checkbox
            (change)="toggleRow(row)"
            [checked]="selection.isSelected(row)"
          ></mat-checkbox>
        </td>
      </ng-container>
    }

    <ng-container matColumnDef="serviceName">
      <th mat-header-cell *matHeaderCellDef>Servicio</th>
      <td mat-cell *matCellDef="let row">{{ row.serviceName }}</td>
    </ng-container>

    <ng-container matColumnDef="destination">
      <th mat-header-cell *matHeaderCellDef>Socio / Puesto</th>
      <td mat-cell *matCellDef="let row">{{ row.destination }}</td>
    </ng-container>

    <ng-container matColumnDef="period">
      <th mat-header-cell *matHeaderCellDef>Período</th>
      <td mat-cell *matCellDef="let row">{{ row.period }}</td>
    </ng-container>

    <ng-container matColumnDef="amountFormatted">
      <th mat-header-cell *matHeaderCellDef class="amount-header">Monto</th>
      <td mat-cell *matCellDef="let row" class="amount-cell">{{ row.amount }}</td>
    </ng-container>

    <ng-container matColumnDef="statusChip">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let row">
        <app-status-chip
          [label]="row.statusChip.label"
          [tone]="row.statusChip.tone"
        ></app-status-chip>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
  </table>

  <mat-paginator
    [length]="totalElements()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 20, 50]"
    showFirstLastButtons
    (page)="onPage($event)"
  />
</div>
