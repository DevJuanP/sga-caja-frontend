<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="cd-message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ data.cancelLabel ?? 'Cancelar' }}</button>
  <button mat-flat-button [class.cd-danger]="data.danger" (click)="confirm()">
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
