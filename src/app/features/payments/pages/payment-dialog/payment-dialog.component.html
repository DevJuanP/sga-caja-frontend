<div class="payment-dialog-container">
  @if (!paid()) {
    <h2 mat-dialog-title>Calcular total a cobrar</h2>
    <mat-dialog-content>
      <div class="payment-summary">
        <div class="summary-row">
          <span class="label">CxC seleccionadas:</span>
          <span class="value">{{ uuids.length }}</span>
        </div>
        <div class="summary-row total-row">
          <span class="label">Total a cobrar:</span>
          <span class="amount">S/ {{ total.toFixed(2) }}</span>
        </div>
      </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close>Cancelar</button>
      <button mat-flat-button color="primary" (click)="confirmPayment()" [disabled]="loading()">
        @if (loading()) {
          <mat-icon class="spinner">hourglass_empty</mat-icon>
        }
        Confirmar y pagar
      </button>
    </mat-dialog-actions>
  } @else {
    <h2 mat-dialog-title>Pago procesado</h2>
    <mat-dialog-content>
      @if (receiptData) {
        <app-receipt-viewer [receipt]="receiptData"></app-receipt-viewer>
      }
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-flat-button color="primary" (click)="close()">Cerrar</button>
    </mat-dialog-actions>
  }
</div>
