<h2 mat-dialog-title>{{ editing ? 'Editar giro' : 'Nuevo giro' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="bf-field">
      <mat-label>Nombre</mat-label>
      <input matInput type="text" formControlName="name" placeholder="Ej: Alimentos" autocomplete="off" />
      @if (form.controls.name.hasError('required') && form.controls.name.touched) {
        <mat-error>El nombre es obligatorio</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancelar</button>
  <button mat-flat-button type="button" [disabled]="loading() || form.invalid" (click)="onSubmit()">
    <span>{{ loading() ? 'Guardando...' : 'Guardar' }}</span>
  </button>
</mat-dialog-actions>
