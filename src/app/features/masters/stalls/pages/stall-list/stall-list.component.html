<app-page-header title="Puestos" subtitle="Gestión de puestos del mercado">
  <button mat-flat-button type="button" (click)="openCreate()">
    <mat-icon aria-hidden="true">add</mat-icon>
    Nuevo puesto
  </button>
</app-page-header>

<app-filter-bar placeholder="Número o inquilino" (filterChange)="onFilterChange($event)" />

<app-crud-table
  [columns]="columns"
  [rows]="rows()"
  [totalElements]="totalElements()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [loading]="loading()"
  [actions]="rowActions"
  emptyMessage="No hay puestos"
  (pageChange)="onPageChange($event)"
  (sortChange)="onSortChange($event)"
  (actionClick)="onAction($event)"
/>
